<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Software Development — Cybersecurity Portfolio</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/project.css">
    <link rel="stylesheet" href="assets/pdf-viewer.css">
</head>
<body>
    <div class="project-container">
        <a href="catalog.html" class="back-link"><span class="arr">&larr;</span> Back to Projects</a>
        <header class="project-header">
            <h1>Secure Software Development</h1>
            <p class="description">Auditing a web application for vulnerabilities, remediating issues, and validating fixes through security testing.</p>
        </header>

        <div class="doc-sections">
            <button class="doc-toggle" type="button">
                <span class="doc-label">Static Code Analysis</span>
                <span class="doc-hint">Documents the static code analysis performed on a Flask web application to surface security vulnerabilities. It identifies hardcoded secrets, plaintext passwords, commented-out code, and other weaknesses, and includes 45 screenshots showing each finding exactly as it appeared in the analysis tools, so you can see the vulnerabilities in context.</span>
                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer" data-src="assets/pdfs/software-task1.pdf"></div>
            </div>

            <button class="doc-toggle" type="button">
                <span class="doc-label">Security Testing & Remediation</span>
                <span class="doc-hint">Covers the remediation and validation phase: fixing the vulnerabilities found (moving secrets to environment variables, hashing passwords, adding API authentication), then writing and running automated tests to confirm each fix. Expect 18 screenshots showing each vulnerability alongside its fix, plus the automated test results that prove the remediations pass.</span>
                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer" data-src="assets/pdfs/software-task2.pdf"></div>
            </div>

        </div>
    </div>
    <script src="assets/matrix-rain.js"></script>
    <script src="assets/doc-viewer.js"></script>
    <script src="assets/pdf-viewer.js"></script>
    <script src="assets/cursor-page.js"></script>
</body>
</html>
