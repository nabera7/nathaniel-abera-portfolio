<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Program Management — Cybersecurity Portfolio</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/project.css">
    <link rel="stylesheet" href="assets/pdf-viewer.css">
</head>
<body>
    <div class="project-container">
        <a href="catalog.html" class="back-link"><span class="arr">&larr;</span> Back to Projects</a>
        <header class="project-header">
            <h1>Security Program Management</h1>
            <p class="description">Managing information security strategically with risk assessment and security program design.</p>
        </header>

        <div class="doc-sections">
            <button class="doc-toggle" type="button">
                <span class="doc-label">Security Program Assessment</span>
                <span class="doc-hint">Evaluates an organization's existing security management program and identifies its deficiencies. Breaks down where the current program falls short and the risks those gaps create.</span>
                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer" data-src="assets/pdfs/program-task1.pdf"></div>
            </div>

            <button class="doc-toggle" type="button">
                <span class="doc-label">Risk Management</span>
                <span class="doc-hint">A risk-focused analysis that identifies specific threats, rates their likelihood and impact, and connects them to the organization's risk posture and mitigation options.</span>
                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer" data-src="assets/pdfs/program-task2.pdf"></div>
            </div>

            <button class="doc-toggle" type="button">
                <span class="doc-label">Program Improvement</span>
                <span class="doc-hint">Recommends concrete improvements to the security program, including mandatory security awareness training, phishing simulations, a formal patch management policy, and continuous vulnerability monitoring. Supports each recommendation with industry standards and real case-study events.</span>
                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer" data-src="assets/pdfs/program-task3.pdf"></div>
            </div>

        </div>
    </div>
    <script src="assets/matrix-rain.js"></script>
    <script src="assets/doc-viewer.js"></script>
    <script src="assets/pdf-viewer.js"></script>
    <script src="assets/cursor-page.js"></script>
</body>
</html>
