<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Response & Remediation — Cybersecurity Portfolio</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/project.css">
</head>
<body>
    <div class="project-container">
        <a href="catalog.html" class="back-link">&larr; Back to Projects</a>
        <header class="project-header">
            <h1>Incident Response & Remediation</h1>
            <p class="description">A complete incident response engagement beginning with a phishing alert and following the compromise through detection, investigation, containment, eradication, and recovery.</p>
        </header>

        <div class="doc-sections">
            <button class="doc-toggle" type="button">
                <span class="doc-label">Executive Summary & Remediation Report</span>
                <span class="doc-hint">A complete write-up of the phishing incident response: how the compromise was detected, the step-by-step investigation that traced the attack chain and lateral movement, and every remediation action taken to contain and recover. Includes 21 lab screenshots documenting each phase, from the initial phishing report through to verified recovery and account cleanup.</span>
                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer">
                    <iframe src="assets/pdfs/incident-response-task1.pdf#toolbar=1&navpanes=0" title="Executive Summary & Remediation Report"></iframe>
                </div>
            </div>

            <button class="doc-toggle" type="button">
                <span class="doc-label">Improvement Plan</span>
                <span class="doc-hint">A follow-up plan proposing security improvements to prevent recurrence. Walks through a formal risk analysis (likelihood and severity for each identified risk), then recommends specific controls such as multifactor authentication and least-privilege enforcement, mapped to NIST standards and the Gramm-Leach-Bliley Act Safeguards Rule.</span>
                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer">
                    <iframe src="assets/pdfs/incident-response-task2.pdf#toolbar=1&navpanes=0" title="Improvement Plan"></iframe>
                </div>
            </div>

        </div>
    </div>
    <script src="assets/matrix-rain.js"></script>
    <script src="assets/doc-viewer.js"></script>
    <script src="assets/cursor-page.js"></script>
</body>
</html>
