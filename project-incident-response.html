        <header class="project-header">
            <h1>Incident Response & Remediation</h1>
            <p class="description">A complete incident response engagement beginning with a phishing alert and following the compromise through detection, investigation, containment, eradication, and recovery. This project includes 27 lab screenshots in total across its tasks.</p>
        </header>

        <div class="doc-sections">
            <button class="doc-toggle" type="button">
                <span class="doc-label">Executive Summary & Remediation Report</span>
                <span class="doc-hint">A complete write-up of the phishing incident response, from detection through to recovery. Walks through how the compromise was found, the investigation that traced the attack chain and lateral movement, and every remediation step taken. Contains 21 lab screenshots documenting each phase, from the phishing report through to malware removal and account cleanup.</span>
                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer" data-src="assets/pdfs/incident-response-task1.pdf"></div>
            </div>

            <button class="doc-toggle" type="button">
                <span class="doc-label">Improvement Plan</span>
                <span class="doc-hint">A follow-up plan proposing security improvements to prevent a repeat incident. Walks through a formal risk analysis (rating likelihood and severity for each risk), then recommends controls such as multifactor authentication and least-privilege enforcement. Contains 6 screenshots showing the proposed control configuration.</span>
                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer" data-src="assets/pdfs/incident-response-task2.pdf"></div>
            </div>
