<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Response & Remediation — Cybersecurity Portfolio</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/project.css">
    <link rel="stylesheet" href="assets/pdf-viewer.css">
</head>
<body>
    <div class="project-container">
        <a href="catalog.html" class="back-link"><span class="arr">&larr;</span> Back to Projects</a>
        <header class="project-header">
            <h1>Incident Response & Remediation</h1>
            <p class="description">A complete incident response engagement beginning with a phishing alert and following the compromise through detection, investigation, containment, eradication, and recovery.</p>
        </header>

        <div class="doc-sections">
            <button class="doc-toggle" type="button">
                <span class="doc-label">Executive Summary & Remediation Report</span>
                <span class="doc-hint">A complete write-up of the phishing incident response, from detection through to recovery. It walks you through how the compromise was found, the investigation that traced the attack chain and lateral movement, and every remediation step taken. Expect 21 lab screenshots woven throughout the document, each showing a concrete phase of the response such as the phishing report, ticket creation, Kerberos analysis, malware removal, and account cleanup.</span>
                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer" data-src="assets/pdfs/incident-response-task1.pdf"></div>
            </div>

            <button class="doc-toggle" type="button">
                <span class="doc-label">Improvement Plan</span>
                <span class="doc-hint">A follow-up plan proposing security improvements to prevent a repeat incident. It walks through a formal risk analysis (rating likelihood and severity for each identified risk), then recommends concrete controls such as multifactor authentication and least-privilege enforcement, mapped to NIST standards and the Gramm-Leach-Bliley Act Safeguards Rule. Includes supporting screenshots of the proposed control configuration.</span>
                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer" data-src="assets/pdfs/incident-response-task2.pdf"></div>
            </div>

        </div>
    </div>
    <script src="assets/matrix-rain.js"></script>
    <script src="assets/doc-viewer.js"></script>
    <script src="assets/pdf-viewer.js"></script>
    <script src="assets/cursor-page.js"></script>
</body>
</html>
