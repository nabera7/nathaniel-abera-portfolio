<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptography — Cybersecurity Portfolio</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>
    <div class="project-container">
        <a href="catalog.html" class="back-link">&larr; Back to Projects</a>
        <header class="project-header">
            <h1>Cryptography</h1>
            <p class="description">Hands-on work with encryption, hashing, and public key infrastructure to protect data at rest and in transit.</p>
        </header>

        <div class="doc-sections">
            <button class="doc-toggle" type="button">
                <span class="doc-label">Symmetric & Asymmetric Encryption</span>
                <span class="doc-hint">Hands-on lab documentation covering both RSA (asymmetric) and AES-256 (symmetric) encryption. Walks through generating key pairs, encrypting and decrypting files across virtual machines, and the challenges of key delivery and verification, with screenshots of each lab step.</span>
                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer">
                    <iframe src="assets/pdfs/crypto-task1.pdf#toolbar=1&navpanes=0" title="Symmetric & Asymmetric Encryption"></iframe>
                </div>
            </div>

            <button class="doc-toggle" type="button">
                <span class="doc-label">Cryptographic Analysis</span>
                <span class="doc-hint">Applies cryptographic concepts to a given scenario, explaining which methods are used, why they're appropriate, and the security trade-offs involved.</span>
                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer">
                    <iframe src="assets/pdfs/crypto-task2.pdf#toolbar=1&navpanes=0" title="Cryptographic Analysis"></iframe>
                </div>
            </div>

        </div>
    </div>
