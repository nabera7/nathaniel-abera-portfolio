<!DOCTYPE html>

<head>

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

<body>
    <div class="project-container">
        <a href="catalog.html" class="back-link"><span class="arr">&larr;</span> Back to Projects</a>

            <h1>Python Automation for Network Monitoring</h1>
            <p class="description">Automating DNS monitoring, network device management, and email alerting with Python scripts.</p>
        </header>
        <div class="repo-section">
            <h2>Source Code Repository</h2>
            <p class="repo-note">The Python automation scripts are available to browse below.</p>
            <div class="repo-frame">
                <iframe src="https://nabera7.github.io/python-network-automation/" title="Network Automation Repository"></iframe>

            <button class="doc-toggle" type="button">

                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer" data-src="assets/pdfs/network-task1.pdf"></div>
            </div>

                <span class="doc-label">Notification Templates</span>
                <span class="doc-hint">The notification templates for device-unavailable and ticket-related alerts, including the subject lines and body structure used to keep administrators informed automatically. Includes screenshots showing the device-list, created tickets, and DNS alert emails as they appear in the environment.</span>

            </button>
            <div class="doc-panel">

        </div>
