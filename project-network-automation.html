<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Automation & Monitoring — Cybersecurity Portfolio</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <div class="project-container">
        <a href="catalog.html" class="back-link">&larr; Back to Projects</a>

        <div class="repo-section">
