<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Ethics in Technology — Cybersecurity Portfolio</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>
    <div class="project-container">
        <a href="catalog.html" class="back-link">&larr; Back to Projects</a>
        <header class="project-header">
            <h1>Ethics in Technology</h1>
            <p class="description">Applying ethical frameworks to real security dilemmas involving privacy, responsible disclosure, and professional obligations.</p>
        </header>

        <div class="doc-sections">
            <button class="doc-toggle" type="button">
                <span class="doc-label">Ethical Issues Analysis</span>
                <span class="doc-hint">Analyzes a real-world-style scenario where a healthcare provider mishandling data raises ethical concerns, then applies professional ethics codes to evaluate what went wrong and what the correct course of action should have been.</span>
                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer" data-src="assets/pdfs/ethics-task1.pdf"></div>
            </div>

            <button class="doc-toggle" type="button">
                <span class="doc-label">Ethical Guidance & Behaviors</span>
                <span class="doc-hint">Explores codes of ethics and how they guide security professionals, including a deep look at AI bias (such as facial recognition inaccuracies and ATS hiring bias) and the principle of fairness and non-discrimination. Includes the specific real-world cases examined.</span>
                <span class="view-prompt">Click to View</span>
            </button>
            <div class="doc-panel">
                <div class="pdf-viewer" data-src="assets/pdfs/ethics-task2.pdf"></div>
            </div>

        </div>
    </div>
